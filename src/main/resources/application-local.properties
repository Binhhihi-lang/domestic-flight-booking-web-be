# Profile local — chạy toàn bộ bằng hạ tầng Docker (docker-compose.dev.yml).
# KHÔNG cần biến môi trường: mọi giá trị đã cố định cho môi trường dev local.
#
#   docker compose -f docker-compose.dev.yml up -d
#   mvn spring-boot:run -Dspring-boot.run.profiles=local

spring.datasource.url=jdbc:postgresql://localhost:5433/flightbooking
spring.datasource.username=flight
spring.datasource.password=flight

# Cloudinary — để trống khi chạy local, chức năng upload avatar sẽ không dùng được
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

# JPA — schema do Flyway quản lý
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis local
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.ssl.enabled=false

# JWT (chỉ dùng khi chạy local)
jwt.signer-key=local-dev-secret-key-do-not-use-in-production-0123456789
jwt.access-duration=3600
jwt.refreshable-duration=1209600
