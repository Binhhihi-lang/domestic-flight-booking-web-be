# Profile local — chạy bằng hạ tầng Docker của docker-compose.yml (chỉ 2 container).
# KHÔNG cần biến môi trường: mọi giá trị đã cố định cho môi trường dev local.
#
#   docker compose up -d postgres redis
# chạy backend local 
# .\domestic-flight-booking-web-backend\mvnw.cmd -s D:\Maven\.m2\settings.xml spring-boot:run -f domestic-flight-booking-web-backend\pom.xml

spring.datasource.url=jdbc:postgresql://localhost:5433/flightbooking
spring.datasource.username=flight
spring.datasource.password=flight

# Cloudinary — để trống khi chạy local, chức năng upload avatar sẽ không dùng được
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

# JPA — schema do Flyway quản lý
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis local
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.ssl.enabled=false

# JWT (chỉ dùng khi chạy local)
jwt.signer-key=local-dev-secret-key-do-not-use-in-production-0123456789
jwt.access-duration=3600
jwt.refreshable-duration=1209600

# CORS — frontend Angular dev server
app.cors.allowed-origins=http://localhost:4200

# Email — local KHÔNG gửi thư thật: liên kết đặt lại mật khẩu chỉ ghi ra log.
# Vẫn phải khai host: thiếu nó Spring Boot không tạo bean JavaMailSender.
spring.mail.host=localhost
app.mail.enabled=false

# Bật tự động seeder 100.000 chuyến bay của 5 hãng hàng không trên môi trường local
app.seed.large-dataset=true
