# URL kết nối lên Cloud Aiven
spring.datasource.url=${FLIGHTBOOKING_DB_URL}
spring.datasource.username=${DB_FB_USERNAME}
spring.datasource.password=${DB_FB_PASSWORD}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JPA — schema do Flyway quản lý, Hibernate chỉ xác nhận khớp entity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis — blacklist access token + whitelist refresh token + cache permission
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# JWT
jwt.signer-key=${JWT_SIGNER_KEY}
jwt.access-duration=${JWT_ACCESS_DURATION:3600}
jwt.refreshable-duration=${JWT_REFRESHABLE_DURATION:1209600}