# Profile "docker" — chạy cả hệ thống trong Docker Compose (docker compose up -d --build).
# Host/port trỏ tới TÊN SERVICE của compose (postgres, redis) chứ không phải localhost:
# trong container, "localhost" là chính container đó.
# Không cần biến môi trường nào để chạy demo; mọi giá trị đều có mặc định.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/flightbooking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flight}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:flight}

# Cloudinary — để trống thì chức năng upload ảnh không dùng được, phần còn lại vẫn chạy.
cloudinary.cloud-name=${CLOUDINARY_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# JPA — schema do Flyway quản lý (V1..V15 tự chạy khi khởi động trên DB trống)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false

# Khóa ký JWT — CHỈ dùng cho demo, đổi qua biến môi trường khi triển khai thật.
jwt.signer-key=${JWT_SIGNER_KEY:docker-demo-signer-key-change-me-0123456789abcdef}
jwt.access-duration=${JWT_ACCESS_DURATION:3600}
jwt.refreshable-duration=${JWT_REFRESHABLE_DURATION:1209600}

# CORS — FE được mở từ trình duyệt (nginx phục vụ ở cổng 4200)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Email — mặc định tắt, liên kết đặt lại mật khẩu chỉ ghi ra log.
# Vẫn phải khai spring.mail.host: thiếu nó Spring Boot không tạo bean
# JavaMailSender và SmtpMailService không khởi tạo được.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${MAIL_ENABLED:false}
app.auth.reset-link-base=${AUTH_RESET_LINK_BASE:http://localhost:4200/forgot-password}
