spring.application.name=domestic-flight-booking-web-backend
spring.profiles.active=dev

# JSON dùng snake_case cho mọi field (mục 1.2 — API Design v0.2):
# DTO Java viết camelCase (airlineName) nhưng JSON ra ngoài là airline_name.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Thời gian ra chuỗi ISO-8601 thay vì mảng số
spring.jackson.serialization.write-dates-as-timestamps=false

# Nạp biến từ file .env ở thư mục gốc dự án (chạy từ project root, vd: mvn spring-boot:run).
# optional: thiếu .env cũng không lỗi -> ai dùng biến môi trường OS vẫn chạy bình thường.
# [.properties] bắt Spring đọc .env theo cú pháp KEY=value (không dùng export, không bọc nháy).
spring.config.import=optional:file:./.env[.properties]
