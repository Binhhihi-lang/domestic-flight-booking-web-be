spring.application.name=domestic-flight-booking-web-backend
spring.profiles.active=dev

# JSON dùng snake_case cho mọi field (mục 1.2 — API Design v0.2):
# DTO Java viết camelCase (airlineName) nhưng JSON ra ngoài là airline_name.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Thời gian ra chuỗi ISO-8601 (Jackson 3 đặt dưới datatype.datetime, không còn
# là SerializationFeature.write-dates-as-timestamps như Jackson 2)
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Nạp biến từ file .env ở thư mục gốc dự án (chạy từ project root, vd: mvn spring-boot:run).
# optional: thiếu .env cũng không lỗi -> ai dùng biến môi trường OS vẫn chạy bình thường.
# [.properties] bắt Spring đọc .env theo cú pháp KEY=value (không dùng export, không bọc nháy).
spring.config.import=optional:file:./.env[.properties]

# ===== Email (AUTH-04) =====
# enabled=false → chỉ ghi liên kết đặt lại mật khẩu vào log, không gửi thư.
# Bật bằng cách đặt MAIL_ENABLED=true và điền spring.mail.* trong profile.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@vinafly.local}
app.name=VinaFly

# Gốc liên kết trong thư đặt lại mật khẩu — trỏ về trang FE.
app.auth.reset-link-base=${AUTH_RESET_LINK_BASE:http://localhost:4200/forgot-password}
# Mặc định FALSE: token chỉ đi qua email, không bao giờ lộ trong response.
# Chỉ bật true khi cần test luồng đặt lại mà không có hộp thư thật.
app.auth.expose-reset-token=${AUTH_EXPOSE_RESET_TOKEN:false}

# ===== Tỉ lệ giá vé theo loại hành khách (DB v0.5 mục 5.3) =====
app.pricing.child-fare-percent=${PRICING_CHILD_FARE_PERCENT:75}
app.pricing.infant-fare-percent=${PRICING_INFANT_FARE_PERCENT:10}

# ===== Seeder dữ liệu lớn 100.000 chuyến bay (chỉ bật ở local/docker hoặc khi cấu hình) =====
app.seed.large-dataset=${SEED_LARGE_DATASET:false}

# ===== Cổng thanh toán VNPay (chuẩn v2.1.0 — để trống sẽ chạy Mock Gateway) =====
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.hash-type=${VNPAY_HASH_TYPE:hmacsha512}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.version=2.1.0
vnpay.currency=VND
vnpay.locale=vn
vnpay.order-type=other
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}
vnpay.fe-return-url=${VNPAY_FE_RETURN_URL:http://localhost:4200/payment-result}

# ===== Cổng thanh toán payOS (VietQR — để trống sẽ dùng VietQR tĩnh/Mock) =====
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.base-url=${PAYOS_BASE_URL:https://api-merchant.payos.vn}
payos.checkout-host=${PAYOS_CHECKOUT_HOST:https://pay.payos.vn}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:8080/api/payments/payos/return}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8080/api/payments/payos/cancel}
payos.fe-return-url=${PAYOS_FE_RETURN_URL:http://localhost:4200/payment-result}
