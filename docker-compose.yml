# =====================================================================
# Docker duy nhất của dự án: hạ tầng (postgres + redis) lẫn toàn bộ hệ thống.
# Máy đích chỉ cần Docker Desktop — không cần Java, Node, PostgreSQL, Redis.
#
#   docker compose up -d postgres redis   # chỉ hạ tầng cho IDE (profile local / dev)
#   docker compose up -d --build          # cả hệ thống, build lần đầu
#   docker compose logs -f backend        # xem log backend
#   docker compose down                   # tắt, GIỮ dữ liệu
#   docker compose down -v                # tắt, xóa sạch dữ liệu (reset)
#
# Sau khi lên:
#   http://localhost:4200  → giao diện (nginx phục vụ Angular + proxy /api)
#   http://localhost:8080  → API backend
#   Tài khoản ADMIN tạo tự động ở DB trống: admin@flightbooking.local / Admin@12345
#
# Muốn dùng DB thật (Aiven) thay vì postgres trong compose: xem mục "Aiven"
# trong docs/Docker_Hoa_Trien_Khai.md.
# =====================================================================

name: vinafly

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flightbooking
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
    volumes:
      # Postgres 18 dùng layout /var/lib/postgresql (data nằm trong subdir version-specific)
      - pgdata:/var/lib/postgresql
    ports:
      # Mở ra host để IDE chạy profile `local` nối vào localhost:5433.
      # Trong compose network backend vẫn gọi postgres:5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flightbooking"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      # Mở ra host cho IDE (profile local) và cho profile dev dùng Aiven + Redis local.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: .
    image: vinafly/backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:-docker-demo-signer-key-change-me-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      CLOUDINARY_NAME: ${CLOUDINARY_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # Build từ repo frontend cùng cấp (D:\ChuyenDeTT\domestic-flight-booking-web-frontend)
    build: ../domestic-flight-booking-web-frontend
    image: vinafly/frontend:latest
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
